name: Ci/cd for portfolio app

on:
    push:
        branches: [main]
    workflow_dispatch:

permissions:
    contents: write
jobs:
    build_and_deploy:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v3

            - name: Set up Node.js
              uses: actions/setup-node@v3
              with:
                  node-version: '22'

            - name: Install dependencies
              run: npm install

            - name: Build the React app
              run: npm run build

            - name: Deploy to GitHub Pages
              uses: jamesIves/github-pages-deploy-action@4.1.0
              with:
                  branch: gh-pages
                  folder: dist
        